<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영단어장</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f5;
            color: #09090b;
            font-size: 14px;
            line-height: 1.4;
        }

        body { 
            max-width: 600px;
            margin: 0 auto; 
            padding: 12px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .card { 
            background: #ffffff; 
            border: 1px solid #e4e4e7; 
            border-radius: 12px;
            overflow: hidden; 
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        #main-menu-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #main-menu-card .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        #main-menu-card button {
            flex: 1;
            min-height: 44px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            background-color: #ffffff;
            color: #09090b;
            border: 1px solid #e4e4e7;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: -0.2px;
            transition: background-color 0.15s, border-color 0.15s;
        }
        #main-menu-card button::after {
            content: "→";
            font-size: 0.85rem;
            color: #a1a1aa;
        }
        #main-menu-card button:active {
            background-color: #f4f4f5;
            border-color: #d4d4d8;
        }
        
        .card.full-height {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            padding: 12px 14px;
            background-color: #ffffff;
            border-bottom: 1px solid #f4f4f5;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .card-header h2 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #09090b;
            letter-spacing: -0.3px;
        }
        .card-header .toggle-icon {
            font-size: 0.75rem;
            color: #71717a;
            font-weight: 600;
        }
        
        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card.full-height .card-content {
            flex: 1;
            overflow: hidden;
        }
        .card-content.collapsed {
            display: none;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #e4e4e7;
            font-size: 0.85rem;
            resize: none;
            background-color: #fafafa;
            border-radius: 8px;
            color: #09090b;
        }
        textarea:focus {
            outline: none;
            border-color: #09090b;
            background-color: #ffffff;
        }

        button { 
            width: 100%;
            height: 42px; 
            background-color: #09090b;
            color: #ffffff; 
            border: 1px solid #09090b;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            border-radius: 8px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        button:active {
            background-color: #27272a;
            border-color: #27272a;
        }
        button.btn-secondary {
            background-color: #ffffff;
            color: #09090b;
            border: 1px solid #e4e4e7;
        }
        button.btn-secondary:active {
            background-color: #f4f4f5;
            border-color: #d4d4d8;
        }
        
        .hidden { display: none !important; }
        .margin-top-8 { margin-top: 8px; }
        
        .result-msg {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            padding: 10px;
            border: 1px solid #09090b;
            font-weight: 600;
            border-radius: 8px;
        }
        .correct {
            background-color: #09090b;
            color: #ffffff;
            border-color: #09090b;
        }
        .wrong {
            background-color: #f4f4f5;
            color: #18181b;
            border-color: #e4e4e7;
        }
        
        .set-selection-list {
            text-align: left;
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e4e4e7;
            padding: 4px;
            border-radius: 8px;
            background: #ffffff;
        }
        .set-item {
            display: flex;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid #f4f4f5;
        }
        .set-item:last-child { border-bottom: none; }
        .set-item label {
            flex: 1;
            font-size: 0.9rem;
            margin-left: 10px;
            cursor: pointer;
            color: #18181b;
        }

        .flashcard-box {
            position: relative;
            border: 1px solid #e4e4e7;
            padding: 16px;
            text-align: center;
            margin: 4px 0;
            background-color: #fafafa;
            cursor: pointer;
            flex: 1;
            border-radius: 10px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.15s;
        }
        .flashcard-box:active {
            background-color: #f4f4f5;
        }
        
        .flash-meta {
            position: absolute;
            top: 12px;
            left: 12px;
            text-align: left;
            color: #71717a;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .flash-text-main {
            font-size: 1.8rem;
            font-weight: 700;
            color: #09090b;
            margin-bottom: 6px;
            word-break: keep-all;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        .flash-text-sub {
            font-size: 1.1rem;
            color: #27272a;
            margin-top: 6px;
            font-weight: 600;
            word-break: keep-all;
        }
        
        .flash-example { 
            font-size: 0.9rem;
            color: #09090b;
            margin-top: 8px; 
            padding: 10px;
            border: 1px solid #e4e4e7;
            width: 100%;
            word-break: keep-all; 
            border-radius: 8px;
            background: #ffffff;
            text-align: left;
        }
        .flash-ex-ko {
            background: #f4f4f5;
            border-color: #e4e4e7;
            color: #52525b;
        }
        
        .flash-guide {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin-top: 10px;
        }

        .audio-btn-wrapper {
            text-align: center;
            margin-bottom: 6px;
        }
        .audio-btn {
            background: #ffffff;
            color: #09090b;
            border: 1px solid #d4d4d8;
            cursor: pointer; 
            font-size: 0.75rem;
            height: auto;
            padding: 3px 10px;
            font-weight: 600; 
            border-radius: 20px;
            display: inline-flex;
            width: auto;
        }
        .audio-btn:active { background: #f4f4f5; }
        
        .top-ctrl-container {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .top-ctrl-btn {
            font-size: 0.7rem;
            background: #ffffff;
            border: 1px solid #d4d4d8;
            cursor: pointer;
            color: #52525b;
            height: auto;
            padding: 4px 10px;
            width: auto;
            font-weight: 600;
            border-radius: 20px;
            white-space: nowrap;
        }
        .top-ctrl-btn.active {
            background: #09090b;
            color: #ffffff;
            border-color: #09090b;
        }

        .mc-option {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            padding: 0 12px;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            color: #09090b; 
            width: 100%;
            border-radius: 8px;
            height: 42px; 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transition: background-color 0.15s;
        }
        .mc-option:active { background-color: #f4f4f5; }
        .mc-option.selected-correct {
            border: 2px solid #09090b;
            font-weight: 700;
            background-color: #ffffff;
            color: #09090b;
        }
        .mc-option.selected-wrong {
            background-color: #f4f4f5;
            color: #a1a1aa;
            text-decoration: line-through;
            border-color: #e4e4e7;
        }

        .spelling-input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            font-size: 1.05rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid #d4d4d8;
            margin-bottom: 6px;
            background: #ffffff;
            color: #09090b;
            border-radius: 8px;
        }
        .spelling-input:focus {
            outline: none;
            border-color: #09090b;
        }

        ul { padding-left: 0; list-style: none; margin: 0; }
        #manage-list li, #set-detail-list li { 
            border-bottom: 1px solid #f4f4f5;
            padding: 10px 0;
            display: flex; 
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }
        
        .item-action-btn {
            background-color: #ffffff;
            color: #09090b;
            border: 1px solid #d4d4d8;
            padding: 0 8px;
            height: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 4px;
            width: auto; 
            border-radius: 6px;
        }
        .item-action-btn:active { background-color: #f4f4f5; }
        
        .scroll-list { flex: 1; overflow-y: auto; padding: 2px; }
        #word-list-container { flex: 1; overflow-y: auto; padding: 4px; }
        
        .word-list-item {
            border-bottom: 1px solid #f4f4f5;
            padding: 4px 0;
            display: flex;
            align-items: stretch;
            gap: 6px;
            background: #ffffff;
        }
        .word-list-item:last-child { border-bottom: none; }
        
        .word-tap-box {
            flex: 1;
            min-height: 40px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #e4e4e7;
            background-color: #fafafa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            user-select: none;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .word-tap-box:active { background-color: #f4f4f5; }
        .word-tap-box.en { font-weight: 700; color: #09090b; font-size: 0.9rem; }
        .word-tap-box.ko { font-weight: 500; color: #3f3f46; font-size: 0.85rem; }
        
        .masked-text { 
            background-color: #e4e4e7 !important; 
            color: transparent !important; 
            border-color: #d4d4d8 !important;
            border-radius: 6px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: #09090b;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.7rem;
            margin-bottom: 4px;
            border-radius: 20px;
        }
        
        .flex-row { display: flex; gap: 6px; width: 100%; }
        .flex-row button { flex: 1; }

        .filter-bar { display: flex; gap: 4px; margin-bottom: 6px; }
        .filter-btn {
            flex: 1;
            height: 34px;
            font-size: 0.8rem;
            border: 1px solid #e4e4e7;
            background: #ffffff;
            color: #09090b;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .filter-btn.active {
            background: #09090b;
            color: #ffffff;
            border-color: #09090b;
        }
        
        .data-manage-card {
            border: 1px solid #e4e4e7;
            background: #ffffff;
            border-radius: 12px;
        }
        .data-manage-card .card-header {
            padding: 10px 14px;
            background-color: transparent;
        }
        .data-manage-card .card-header h2 {
            font-size: 0.85rem;
            color: #52525b;
            font-weight: 600;
        }
        .data-manage-card .card-content {
            padding: 12px;
            gap: 6px;
            max-height: 380px;
            overflow-y: auto;
        }
        .data-manage-card button {
            height: 36px;
            font-size: 0.82rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-menu-container">
        <div class="card" id="main-menu-card">
            <div class="card-content">
                <button onclick="openSetSelection('view-list')">단어장</button>
                <button onclick="openSetSelection('step1-memorize')">단어 학습</button>
                <button onclick="openSetSelection('flash-deep')">예문 학습</button>
                <button onclick="openSetSelection('step2-recall')">객관식 테스트</button>
                <button onclick="openSetSelection('step3-spell')">스펠링 테스트</button>
                <button onclick="openSetSelection('flash-star')">즐겨찾기 단어 복습</button>
                <button onclick="openSetSelection('wrong-drill-choice')">틀린 단어 다시 풀기</button>
            </div>
        </div>

        <div class="card data-manage-card" id="input-section">
            <div class="card-header collapsed" onclick="toggleSection(this)">
                <h2>데이터 관리 및 설정</h2>
                <span class="toggle-icon">[열기]</span>
            </div>
            <div class="card-content collapsed">
                <div style="font-size: 0.75rem; color: #71717a;">
                    형식: Day/순번/단어/뜻/예문/해석<br>
                    예시: Day 01/1/apple/사과/I ate an apple./나는 사과를 먹었다.
                </div>
                <textarea id="bulk-input" placeholder="여기에 데이터를 붙여넣으세요..."></textarea>
                <button onclick="addWordSetsAuto()">단어 등록하기</button>
                
                <div style="margin-top:2px; text-align: right; color: #71717a; font-size: 0.75rem;">저장된 단어장: <strong id="set-count">0</strong>개</div>
                <button class="btn-secondary" onclick="toggleManageList()">단어장 목록 편집 / 삭제</button>
                <button class="btn-secondary" onclick="backupData()">데이터 백업 (파일 저장)</button>
                <button class="btn-secondary" onclick="triggerRestore()">데이터 복구 (파일 불러오기)</button>
                <input type="file" id="restore-input" style="display: none;" accept=".json" onchange="restoreData(this)">
                <button class="btn-secondary margin-top-8" onclick="clearAllData()">전체 데이터 초기화</button>
            </div>
        </div>
    </div>

    <div class="card full-height hidden" id="manage-section">
        <div class="card-content">
            <h2 style="margin:0 0 6px 0; font-size:0.95rem;">목록 편집</h2>
            <div class="scroll-list"><ul id="manage-list"></ul></div>
            <button class="btn-secondary margin-top-8" onclick="toggleManageList()">닫기</button>
        </div>
    </div>

    <div class="card full-height hidden" id="set-detail-section">
        <div class="card-content">
            <h2 id="detail-set-title" style="margin:0 0 6px 0; font-size:0.95rem;">상세 편집</h2>
            <div class="scroll-list"><ul id="set-detail-list"></ul></div>
            <button class="btn-secondary margin-top-8" onclick="closeSetDetail()">뒤로 가기</button>
        </div>
    </div>

    <div class="card full-height hidden" id="selection-section">
        <div class="card-content">
            <h2 style="margin:0 0 6px 0; font-size:0.95rem;">학습할 단어장 선택</h2>
            <div class="flex-row" style="margin-bottom: 4px;">
                <button class="btn-secondary" onclick="selectAllSets(true)">전체 선택</button>
                <button class="btn-secondary" onclick="selectAllSets(false)">선택 해제</button>
            </div>
            <div class="set-selection-list" id="set-selection-container"></div>
            <button class="margin-top-8" onclick="confirmSelection()">시작하기</button>
            <button class="btn-secondary margin-top-8" onclick="closeSelection()">취소</button>
        </div>
    </div>

    <div class="card full-height hidden" id="word-list-section">
        <div class="card-content">
            <h2 style="margin:0 0 6px 0; font-size:0.95rem;">단어 목록</h2>
            <div class="filter-bar">
                <button class="filter-btn active" id="filter-all" onclick="setWordListFilter('all')">전체 보기</button>
                <button class="filter-btn" id="filter-en" onclick="setWordListFilter('hide-en')">단어 가리기</button>
                <button class="filter-btn" id="filter-ko" onclick="setWordListFilter('hide-ko')">뜻 가리기</button>
            </div>
            <div id="word-list-container" style="border: 1px solid #e4e4e7; border-radius: 8px;"></div>
            <button class="btn-secondary margin-top-8" onclick="returnToMain()">메인으로 돌아가기</button>
        </div>
    </div>

    <div class="card full-height hidden" id="flashcard-section">
        <div class="card-content">
            <div style="text-align:center;"><span id="flash-mode-badge" class="badge">모드</span></div>
            <div id="flash-progress" style="text-align:center; font-size: 0.8rem; color: #71717a;">1 / 10</div>
            
            <div class="flashcard-box" onclick="handleFlashClick()">
                <div id="flash-meta-info" class="flash-meta"></div>
                
                <div class="top-ctrl-container">
                    <button id="autoplay-btn" class="top-ctrl-btn" onclick="toggleAutoplay(event)">자동재생</button>
                    <button id="star-btn" class="top-ctrl-btn" onclick="toggleStar(event)">즐겨찾기</button>
                </div>
                
                <div id="flash-content-word-group" style="width:100%;">
                    <div class="audio-btn-wrapper"><button class="audio-btn" onclick="playAudioText('front', 'en', event)">발음 듣기</button></div>
                    <div id="flash-front" class="flash-text-main">Word</div>
                    <div id="flash-back" class="flash-text-sub hidden">Meaning</div>
                </div>

                <div id="flash-content-ex-group" class="hidden" style="width:100%;">
                    <div class="audio-btn-wrapper"><button class="audio-btn" onclick="playAudioText('ex-en', 'en', event)">예문 듣기</button></div>
                    <div id="flash-ex-en" class="flash-example">Example</div>
                    <div id="flash-ex-ko" class="flash-example flash-ex-ko hidden">Translation</div>
                </div>

                <div id="flash-guide" class="flash-guide">화면을 터치하세요</div>
            </div>
            
            <div class="flex-row">
                <button class="btn-secondary" onclick="prevFlashcard()">이전</button>
                <button onclick="handleNextButton()" id="flash-action-btn" class="hidden">다음</button>
            </div>
            
            <button class="btn-secondary margin-top-8" onclick="exitFlashcard()">종료하기</button>
        </div>
    </div>

    <div class="card full-height hidden" id="test-section">
        <div class="card-content">
            <div style="text-align:center;"><span id="test-type-badge" class="badge">테스트</span></div>
            <div id="question-title" style="text-align:center; font-size: 0.8rem; color: #71717a;">문제</div>
            
            <div style="text-align: center; margin: 4px 0; flex:1; display:flex; flex-direction:column; justify-content:center;">
                <div id="question-display" style="width:100%;"></div>
            </div>

            <div id="test-input-container"></div>
            <div id="result-message" class="result-msg hidden"></div>
            
            <button onclick="nextQuestion()" id="next-btn" class="hidden margin-top-8">다음 문제</button>
            <button class="btn-secondary margin-top-8" onclick="returnToMain()">종료하기</button>
        </div>
    </div>

    <div class="card full-height hidden" id="report-section">
        <div class="card-content" style="text-align:center;">
            <h2 style="margin: 6px 0 4px 0; font-size: 1rem;">학습 완료!</h2>
            <div id="report-summary" style="font-size:0.95rem; font-weight:600; margin-bottom:8px;"></div>
            <div class="scroll-list" id="report-wrong-list" style="text-align:left; border: 1px solid #e4e4e7; border-radius: 8px; padding: 6px; margin-bottom: 4px;"></div>
            <button onclick="returnToMain()">메인으로 돌아가기</button>
        </div>
    </div>

<script>
    let wordSets = []; 
    let wrongAnswers = []; 
    let currentTestList = [];
    let currentIndex = 0;
    
    let flashMode = ''; 
    let flashStep = 0; 
    let currentTestMode = ''; 
    
    let editingSetId = null; 
    let synth = window.speechSynthesis;

    let autoplayTimeout = null;
    let isAutoplay = false;

    let sessionCorrectCount = 0;
    let sessionWrongWords = [];

    window.onload = function() { loadData(); };

    function returnToMain() {
        stopAutoplay();
        if (synth) synth.cancel();
        currentIndex = 0;
        currentTestList = [];
        sessionCorrectCount = 0;
        sessionWrongWords = [];
        hideAllSections();
        document.getElementById('main-menu-container').classList.remove('hidden');
        loadData();
    }

    function speak(text, lang = 'en', rate = 1.0, onEndCallback = null) {
        if (autoplayTimeout) {
            clearTimeout(autoplayTimeout);
            autoplayTimeout = null;
        }

        if (!synth || !text) {
            if (onEndCallback) onEndCallback();
            return;
        }
        
        synth.cancel();

        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = (lang === 'en') ? 'en-US' : 'ko-KR';
            utterance.rate = rate;

            let hasFinished = false;
            const done = () => {
                if (!hasFinished) {
                    hasFinished = true;
                    if (autoplayTimeout) {
                        clearTimeout(autoplayTimeout);
                        autoplayTimeout = null;
                    }
                    if (onEndCallback) onEndCallback();
                }
            };

            utterance.onend = done;
            utterance.onerror = done;

            const fallbackDuration = Math.max(2000, text.length * 250);
            autoplayTimeout = setTimeout(done, fallbackDuration);

            synth.speak(utterance);
        }, 50);
    }

    function addWordSetsAuto() {
        const rawText = document.getElementById('bulk-input').value.trim();
        if (!rawText) { alert("데이터를 입력해주세요."); return; }

        const lines = rawText.split('\n');
        const tempMap = {}; 
        let successCount = 0;

        lines.forEach(line => {
            const parts = line.split('/');
            if (parts.length >= 4) {
                const dayTitle = parts[0].trim();
                const seq = parts[1].trim(); 
                const word = parts[2].trim();
                const mean = parts[3].trim();
                const ex = parts[4] ? parts[4].trim() : "";
                const exTrans = parts[5] ? parts[5].trim() : "";

                if (dayTitle && word) {
                    if (!tempMap[dayTitle]) tempMap[dayTitle] = [];
                    tempMap[dayTitle].push({ 
                        word: word, mean: mean, ex: ex, exTrans: exTrans,
                        day: dayTitle, seq: seq, isStarred: false 
                    });
                    successCount++;
                }
            }
        });

        if (successCount === 0) {
            alert("입력 형식이 맞지 않습니다.\n형식: Day/순번/단어/뜻/예문/해석");
            return;
        }

        for (const [day, newWords] of Object.entries(tempMap)) {
            const existingIndex = wordSets.findIndex(s => s.title === day);
            if (existingIndex > -1) {
                wordSets[existingIndex].words = wordSets[existingIndex].words.concat(newWords);
            } else {
                wordSets.push({ id: Date.now() + Math.random(), title: day, words: newWords });
            }
        }
        wordSets.sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));

        saveData();
        alert(`${successCount}개의 단어가 등록되었습니다.`);
        document.getElementById('bulk-input').value = '';
        if(!document.getElementById('manage-section').classList.contains('hidden')) renderManageList();
    }

    function editWordInSet(index) {
        const set = wordSets.find(s => s.id === editingSetId);
        if(!set) return;
        const item = set.words[index];
        const oldStr = `${item.day}/${item.seq}/${item.word}/${item.mean}/${item.ex}/${item.exTrans}`;
        const newStr = prompt("데이터 수정 (Day/순번/단어/뜻/예문/해석)", oldStr);

        if (newStr && newStr !== oldStr) {
            const parts = newStr.split('/');
            if (parts.length >= 4) {
                item.day = parts[0].trim();
                item.seq = parts[1].trim();
                item.word = parts[2].trim();
                item.mean = parts[3].trim();
                if(parts[4]) item.ex = parts[4].trim();
                if(parts[5]) item.exTrans = parts[5].trim();
                saveData();
                renderSetDetailList(set);
            } else { alert("형식이 올바르지 않습니다."); }
        }
    }

    function deleteWordInSet(wordIndex) {
        const set = wordSets.find(s => s.id === editingSetId);
        if(!set) return;
        if(confirm("이 단어를 삭제하시겠습니까?")) {
            set.words.splice(wordIndex, 1);
            saveData();

    function restoreData(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.wordSets) wordSets = data.wordSets;
                if (data.wrongAnswers) wrongAnswers = data.wrongAnswers;
                saveData();
                alert("데이터 복구가 완료되었습니다.");
                returnToMain();
            } catch (err) {
                alert("올바르지 않은 백업 파일입니다.");
            }
        };
        reader.readAsText(file);

    let pendingAction = '';

    function openSetSelection(action) {
        if (wordSets.length === 0) { alert("등록된 단어장이 없습니다."); return; }
        pendingAction = action;
        
        if (action === 'wrong-drill-choice') {
            if (wrongAnswers.length === 0) { alert("저장된 오답 기록이 없습니다."); return; }
            startTest(wrongAnswers, 'choice');
            return;
        }
        
        const container = document.getElementById('set-selection-container');
        container.innerHTML = '';
        let hasVisibleSet = false;

        wordSets.forEach(set => {
            const starredCount = set.words.filter(w => w.isStarred).length;
            const totalCount = set.words.length;
            if (action === 'flash-star' && starredCount === 0) return;

            hasVisibleSet = true;
            const div = document.createElement('div');
            div.className = 'set-item';
            
            let labelHtml = (action === 'flash-star') 
                ? `${set.title} (즐겨찾기: <strong>${starredCount}</strong> / ${totalCount})`
                : `${set.title} (${totalCount} 단어)`;

            div.innerHTML = `<input type="checkbox" id="set-${set.id}" value="${set.id}"><label for="set-${set.id}">${labelHtml}</label>`;
            container.appendChild(div);
        });

        if (!hasVisibleSet && action === 'flash-star') {
            container.innerHTML = '<div style="padding:15px; text-align:center; color:#71717a;">즐겨찾기 단어가 없습니다.</div>';
        }

        hideAllSections();
        document.getElementById('selection-section').classList.remove('hidden');

    }

        returnToMain();

    function confirmSelection() {
        const checkboxes = document.querySelectorAll('#set-selection-container input[type="checkbox"]:checked');
        if (checkboxes.length === 0) { alert("단어장을 선택하세요."); return; }
        
        let combinedWords = [];
        checkboxes.forEach(chk => {
            const set = wordSets.find(s => s.id == chk.value);
            if (set) combinedWords = combinedWords.concat(set.words);
        });

        if (combinedWords.length === 0) { alert("선택된 단어장에 단어가 없습니다."); return; }
        
        if (pendingAction === 'step1-memorize') startFlashcard(combinedWords, 'speed');
        else if (pendingAction === 'step2-recall') startTest(combinedWords, 'choice');
        else if (pendingAction === 'step3-spell') startTest(combinedWords, 'spelling');
        else if (pendingAction === 'flash-deep') startFlashcard(combinedWords, 'deep');
        else if (pendingAction === 'flash-star') {
            const starred = combinedWords.filter(w => w.isStarred);
            startFlashcard(starred, 'deep'); 
        }
        else if (pendingAction === 'view-list') showWordList(combinedWords);
    }

    function toggleAutoplay(event) {
        if(event) event.stopPropagation();
        const btn = document.getElementById('autoplay-btn');
        if (isAutoplay) {
            stopAutoplay();
        } else {
            isAutoplay = true;
            btn.classList.add('active');
            btn.innerText = "정지";
            const data = currentTestList[currentIndex];
            if (!data) return;
            
            if (flashStep === 0) {
                speak(data.word, 'en', 1.0, () => {
                    if (isAutoplay && flashStep === 0) handleFlashClick();
                });
            } else if (flashStep === 1) {
                speak(data.mean, 'ko', 1.1, () => {
                    if (isAutoplay && flashStep === 1) handleNextButton();
                });
            } else if (flashStep === 2) {
                speak(data.ex || "예문 없음", 'en', 1.0, () => {
                    if (isAutoplay && flashStep === 2) handleFlashClick();
                });
            } else if (flashStep === 3) {
                speak(data.exTrans || "해석 없음", 'ko', 1.1, () => {
                    if (isAutoplay && flashStep === 3) handleNextButton();
                });
            }
        }
    }

    function stopAutoplay() {
        isAutoplay = false;
        if (autoplayTimeout) clearTimeout(autoplayTimeout);
        autoplayTimeout = null;
        if (synth) synth.cancel();
        const btn = document.getElementById('autoplay-btn');
        if(btn) {
            btn.classList.remove('active');
            btn.innerText = "자동재생";
        }
    }

    function exitFlashcard() {
        returnToMain();
    }

    function handleFlashClick() {
        const data = currentTestList[currentIndex];

        if (flashMode.includes('speed')) {
            if (flashStep === 0) {
                flashStep = 1;
                document.getElementById('flash-back').classList.remove('hidden');
                document.getElementById('flash-guide').classList.add('hidden'); 
                const btn = document.getElementById('flash-action-btn');
                btn.innerText = "다음 단어";
                btn.classList.remove('hidden');
                speak(data.mean, 'ko', 1.1, () => {
                    if (isAutoplay) {
                        autoplayTimeout = setTimeout(() => {
                            if (isAutoplay && flashStep === 1) handleNextButton();
                        }, 1000);
                    }
                }); 
            }
        } else {
            if (flashStep === 0) {
                flashStep = 1;
                document.getElementById('flash-back').classList.remove('hidden');
                document.getElementById('flash-guide').classList.add('hidden'); 
                const btn = document.getElementById('flash-action-btn');
                btn.innerText = "다음";
                btn.classList.remove('hidden');
                speak(data.mean, 'ko', 1.1, () => {
                    if (isAutoplay) {
                        autoplayTimeout = setTimeout(() => {
                            if (isAutoplay && flashStep === 1) handleNextButton();
                        }, 1000);
                    }
                }); 
            }
            else if (flashStep === 2) {
                flashStep = 3;
                document.getElementById('flash-ex-ko').classList.remove('hidden');
                document.getElementById('flash-guide').classList.add('hidden');
                const btn = document.getElementById('flash-action-btn');
                btn.innerText = "다음 단어";
                btn.classList.remove('hidden');
                speak(data.exTrans || "해석 없음", 'ko', 1.1, () => {
                    if (isAutoplay) {
                        autoplayTimeout = setTimeout(() => {
                            if (isAutoplay && flashStep === 3) handleNextButton();
                        }, 1200);

                });

    function handleNextButton() {
        const data = currentTestList[currentIndex];
        if (flashMode.includes('speed')) {
            nextFlashcard();
        } else {
            if (flashStep === 1) {
                flashStep = 2;
                document.getElementById('flash-content-word-group').classList.add('hidden');

    function startTest(list, mode) {

        sessionCorrectCount = 0;
        sessionWrongWords = [];

        document.getElementById('test-section').classList.remove('hidden');
        
        const badge = document.getElementById('test-type-badge');

    function loadQuestion() {
        const data = currentTestList[currentIndex];
        const inputContainer = document.getElementById('test-input-container');
        inputContainer.innerHTML = '';
        document.getElementById('result-message').className = "result-msg hidden";
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('question-title').innerText = `문제 ${currentIndex + 1} / ${currentTestList.length}`;

        let displayHtml = "";
        
        if (currentTestMode === 'spelling') {
            displayHtml = `
                <div class="flash-example" style="margin-top:0; color:#09090b; font-weight:700; font-size:1.2rem; text-align:center;">
                    ${data.mean}
                </div>`;
            
            speak(data.mean, 'ko');

            inputContainer.innerHTML = `
                <input type="text" id="spelling-input" class="spelling-input" placeholder="영어 스펠링 입력" autocomplete="off" autocapitalize="off" spellcheck="false">
                <button onclick="checkAnswer(null, null, null)">정답 확인</button>
            `;
            document.getElementById('spelling-input').addEventListener("keyup", function(event) {
                if (event.key === "Enter") checkAnswer(null, null, null);
            });
            setTimeout(() => document.getElementById('spelling-input').focus(), 100);

        } else {
            displayHtml = `
                <div style="font-size:1.6rem; font-weight:700; margin-bottom:4px; color:#09090b;">
                    <div class="audio-btn-wrapper"><button class="audio-btn" onclick="speak('${data.word.replace(/'/g, "\\'")}', 'en')">단어 듣기</button></div>
                    ${data.word}
                </div>`;
            
            speak(data.word, 'en', 1.0);

            const allWords = getAllWordsFlat();
            let distractors = allWords.filter(w => w.word !== data.word).sort(() => Math.random() - 0.5).slice(0, 3);
            while(distractors.length < 3) { distractors.push({mean: "오답 (단어 부족)"}); }
            
            let options = [...distractors, data].sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'mc-option';
                btn.innerText = opt.mean;
                btn.onclick = () => checkAnswer(btn, opt.mean === data.mean, data);
                inputContainer.appendChild(btn);
            });
        }
        document.getElementById('question-display').innerHTML = displayHtml;
    }

    function checkAnswer(btn, isCorrectChoice, data) {
        const currentData = currentTestList[currentIndex];
        const msgDiv = document.getElementById('result-message');
        let isCorrect = false;

        if (currentTestMode === 'spelling') {
            const inputVal = document.getElementById('spelling-input').value.trim().toLowerCase();
            if (inputVal === currentData.word.toLowerCase()) isCorrect = true;
            document.getElementById('spelling-input').disabled = true;
        } else {
            isCorrect = isCorrectChoice;
            document.querySelectorAll('.mc-option').forEach(b => b.onclick = null);
        }

        msgDiv.classList.remove('hidden');

        if (isCorrect) {
            if(btn) btn.classList.add('selected-correct');
            msgDiv.innerText = "정답입니다!";
            msgDiv.className = "result-msg correct";
            sessionCorrectCount++;
            speak("정답", 'ko', 1.2);
        } else {
            if(btn) btn.classList.add('selected-wrong');
            if (currentTestMode === 'choice') {
                 document.querySelectorAll('.mc-option').forEach(b => {
                     if(b.innerText === currentData.mean) b.classList.add('selected-correct');
                 });
            }
            msgDiv.innerHTML = `오답!<br>정답: <span style="font-weight:700;">${currentData.word}</span> (${currentData.mean})`;
            msgDiv.className = "result-msg wrong";
            sessionWrongWords.push(currentData);
            addToWrong(currentData);
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentTestList.length) {
            loadQuestion();
        } else {
            showReport();
        }
    }

    function showReport() {
        hideAllSections();
        document.getElementById('report-section').classList.remove('hidden');
        const total = currentTestList.length;
        const score = Math.round((sessionCorrectCount / total) * 100);
        
        document.getElementById('report-summary').innerHTML = `
            점수: <strong>${score}점</strong> (${sessionCorrectCount} / ${total})
        `;

        const wrongListDiv = document.getElementById('report-wrong-list');
        wrongListDiv.innerHTML = '';
        if (sessionWrongWords.length === 0) {
            wrongListDiv.innerHTML = '<div style="text-align:center; color:#71717a; padding:8px;">틀린 단어가 없습니다!</div>';
        } else {
            sessionWrongWords.forEach(item => {
                const div = document.createElement('div');
                div.style.padding = '6px 0';
                div.style.borderBottom = '1px solid #f4f4f5';
                div.innerHTML = `<strong style="color:#09090b;">${item.word}</strong> - <span style="color:#52525b;">${item.mean}</span>`;
                wrongListDiv.appendChild(div);
            });
        }
    }

    function addToWrong(data) {
        if (!wrongAnswers.some(w => w.word === data.word)) {
            wrongAnswers.push(data);
            saveData();
        }
    }

    function getAllWordsFlat() {
        let all = [];
        wordSets.forEach(s => all = all.concat(s.words));
        return all;
    }

    function toggleStar(event) {
        event.stopPropagation();
        const data = currentTestList[currentIndex];
        let found = false;
        wordSets.forEach(set => {
            set.words.forEach(w => {
                if(w.word === data.word) {
                    w.isStarred = !w.isStarred;
                    data.isStarred = w.isStarred;
                    found = true;
                }
            });
        });
        if(found) { updateStarBtnUI(data.isStarred); saveData(); }
    }

    function updateStarBtnUI(isStarred) {
        const btn = document.getElementById('star-btn');
        if (!btn) return;
        if (isStarred) {
            btn.innerText = "즐겨찾기 ON";
            btn.classList.add('active');
        } else {
            btn.innerText = "즐겨찾기 OFF";
            btn.classList.remove('active');
        }
    }
</script>
</body>
</html>
